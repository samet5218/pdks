<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PDKS - Kart Okuma Sistemi</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Segoe UI', sans-serif;
    background: #0f172a;
    color: #e2e8f0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px;
  }

  h1 {
    font-size: 1.6rem;
    font-weight: 700;
    color: #38bdf8;
    margin-bottom: 6px;
    letter-spacing: 1px;
    text-align: center;
  }

  .subtitle {
    font-size: 0.85rem;
    color: #64748b;
    margin-bottom: 28px;
    text-align: center;
  }

  .card {
    background: #1e293b;
    border-radius: 16px;
    padding: 24px;
    width: 100%;
    max-width: 480px;
    margin-bottom: 20px;
    border: 1px solid #334155;
  }

  .status-box {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 20px;
  }

  .dot {
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: #ef4444;
    flex-shrink: 0;
    transition: background 0.3s;
  }
  .dot.connected { background: #22c55e; box-shadow: 0 0 8px #22c55e88; }
  .dot.reading { background: #f59e0b; box-shadow: 0 0 8px #f59e0b88; animation: pulse 0.8s infinite; }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  #status-text {
    font-size: 0.95rem;
    color: #94a3b8;
  }

  .btn {
    width: 100%;
    padding: 14px;
    border-radius: 12px;
    border: none;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    margin-bottom: 10px;
  }

  .btn-connect {
    background: #0284c7;
    color: #fff;
  }
  .btn-connect:hover { background: #0369a1; }
  .btn-connect:disabled { background: #334155; color: #64748b; cursor: not-allowed; }

  .btn-read {
    background: #059669;
    color: #fff;
  }
  .btn-read:hover { background: #047857; }
  .btn-read:disabled { background: #334155; color: #64748b; cursor: not-allowed; }

  .btn-disconnect {
    background: transparent;
    color: #ef4444;
    border: 1px solid #ef4444;
    padding: 10px;
    font-size: 0.85rem;
  }
  .btn-disconnect:hover { background: #ef444411; }
  .btn-disconnect:disabled { color: #334155; border-color: #334155; cursor: not-allowed; }

  .result-box {
    background: #0f172a;
    border-radius: 12px;
    padding: 20px;
    border: 1px solid #1e3a5f;
    min-height: 110px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    margin-top: 16px;
  }

  .result-box .uid-label {
    font-size: 0.75rem;
    color: #475569;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 8px;
  }

  .result-box .uid-value {
    font-size: 1.5rem;
    font-weight: 700;
    color: #38bdf8;
    letter-spacing: 3px;
    font-family: 'Courier New', monospace;
    word-break: break-all;
    text-align: center;
  }

  .result-box .time-value {
    font-size: 0.85rem;
    color: #94a3b8;
    margin-top: 10px;
  }

  .result-box .empty-text {
    color: #334155;
    font-size: 0.9rem;
  }

  /* Log listesi */
  .log-title {
    font-size: 0.8rem;
    color: #475569;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 12px;
  }

  #log-list {
    list-style: none;
    max-height: 220px;
    overflow-y: auto;
  }

  #log-list li {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 12px;
    border-radius: 8px;
    margin-bottom: 6px;
    background: #0f172a;
    font-size: 0.85rem;
  }

  #log-list li .log-uid {
    font-family: 'Courier New', monospace;
    color: #38bdf8;
    font-weight: 600;
    letter-spacing: 1px;
  }

  #log-list li .log-time {
    color: #64748b;
    font-size: 0.78rem;
  }

  .clear-btn {
    background: transparent;
    border: none;
    color: #475569;
    font-size: 0.78rem;
    cursor: pointer;
    float: right;
    margin-top: -2px;
  }
  .clear-btn:hover { color: #ef4444; }

  .warn-box {
    background: #431407;
    border: 1px solid #c2410c;
    border-radius: 10px;
    padding: 12px 16px;
    font-size: 0.82rem;
    color: #fdba74;
    max-width: 480px;
    width: 100%;
    margin-bottom: 16px;
    line-height: 1.5;
  }

  .warn-box b { color: #fb923c; }

  /* Scrollbar */
  #log-list::-webkit-scrollbar { width: 4px; }
  #log-list::-webkit-scrollbar-track { background: transparent; }
  #log-list::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
</style>
</head>
<body>

<h1>📟 PDKS Kart Okuma</h1>
<p class="subtitle">ACR122U · WebUSB · Chrome/Edge</p>

<div class="warn-box" id="warn-box">
  ⚠️ <b>Gereksinimler:</b> Bu uygulama yalnızca <b>Chrome veya Edge</b> tarayıcıda çalışır. ACR122U'yu tablette USB OTG ile bağlayın, ardından <b>Cihaza Bağlan</b> butonuna basın.
</div>

<!-- Bağlantı Kartı -->
<div class="card">
  <div class="status-box">
    <div class="dot" id="dot"></div>
    <span id="status-text">Cihaz bağlı değil</span>
  </div>

  <button class="btn btn-connect" id="btn-connect" onclick="connectDevice()">🔌 Cihaza Bağlan</button>
  <button class="btn btn-read" id="btn-read" onclick="readCard()" disabled>📶 Kart Oku</button>
  <button class="btn btn-disconnect" id="btn-disconnect" onclick="disconnectDevice()" disabled>Bağlantıyı Kes</button>

  <!-- Sonuç -->
  <div class="result-box" id="result-box">
    <span class="empty-text">Henüz kart okutulmadı</span>
  </div>
</div>

<!-- Log Kartı -->
<div class="card">
  <div style="display:flex; justify-content:space-between; align-items:center;">
    <div class="log-title">📋 Okuma Geçmişi</div>
    <button class="clear-btn" onclick="clearLog()">Temizle</button>
  </div>
  <ul id="log-list">
    <li style="justify-content:center; color:#334155; font-size:0.82rem;">Henüz kayıt yok</li>
  </ul>
</div>

<script>
  // WebUSB API kontrolü
  if (!navigator.usb) {
    document.getElementById('warn-box').innerHTML =
      '❌ <b>WebUSB Desteklenmiyor!</b> Bu tarayıcı WebUSB API\'yi desteklemiyor. Lütfen <b>Chrome</b> veya <b>Edge</b> kullanın.';
    document.getElementById('warn-box').style.background = '#450a0a';
    document.getElementById('warn-box').style.borderColor = '#dc2626';
    document.getElementById('btn-connect').disabled = true;
  }

  let device = null;
  let logEntries = [];

  // ACR122U USB Vendor/Product ID
  const ACR122U_FILTERS = [
    { vendorId: 0x072F, productId: 0x2200 }, // ACS ACR122U
    { vendorId: 0x072F, productId: 0x221F }, // ACS ACR122T
  ];

  // CCID GET UID komutu (PC/SC APDU)
  const GET_UID_APDU = new Uint8Array([
    0x6B, 0x00, 0x00, 0x00, 0x00, 0x00, 0x01, 0x00, 0x00,
    0xFF, 0xCA, 0x00, 0x00, 0x00
  ]);

  function setStatus(text, state) {
    document.getElementById('status-text').textContent = text;
    const dot = document.getElementById('dot');
    dot.className = 'dot' + (state ? ' ' + state : '');
  }

  async function connectDevice() {
    try {
      device = await navigator.usb.requestDevice({ filters: ACR122U_FILTERS });
      await device.open();

      if (device.configuration === null) {
        await device.selectConfiguration(1);
      }
      await device.claimInterface(0);

      setStatus('Cihaz bağlandı: ' + device.productName, 'connected');
      document.getElementById('btn-connect').disabled = true;
      document.getElementById('btn-read').disabled = false;
      document.getElementById('btn-disconnect').disabled = false;
      document.getElementById('warn-box').style.display = 'none';

    } catch (err) {
      if (err.name !== 'NotFoundError') {
        setStatus('Bağlantı hatası: ' + err.message, '');
        alert('Hata: ' + err.message + '\n\nCihazın takılı olduğundan ve OTG desteklendiğinden emin olun.');
      }
    }
  }

  async function readCard() {
    if (!device) return;

    setStatus('Kart bekleniyor...', 'reading');
    document.getElementById('btn-read').disabled = true;

    try {
      // CCID mesajı gönder
      await device.transferOut(2, GET_UID_APDU);

      // Yanıt al
      const result = await device.transferIn(2, 64);
      const data = new Uint8Array(result.data.buffer);

      // CCID yanıtından UID çıkar (offset 10'dan başlar, son 2 byte SW1/SW2)
      // Yanıt yapısı: CCID header (10 byte) + UID + SW1 + SW2
      if (data.length >= 12) {
        const uidBytes = data.slice(10, data.length - 2);
        const sw1 = data[data.length - 2];
        const sw2 = data[data.length - 1];

        if (sw1 === 0x90 && sw2 === 0x00) {
          const uid = Array.from(uidBytes)
            .map(b => b.toString(16).toUpperCase().padStart(2, '0'))
            .join(':');

          const now = new Date();
          const timeStr = now.toLocaleTimeString('tr-TR') + ' ' +
                          now.toLocaleDateString('tr-TR');

          showResult(uid, timeStr);
          addLog(uid, timeStr);
          setStatus('Kart başarıyla okundu ✓', 'connected');
        } else {
          setStatus('Kart bulunamadı veya hata (SW: ' + sw1.toString(16) + sw2.toString(16) + ')', 'connected');
        }
      } else {
        setStatus('Geçersiz yanıt alındı', 'connected');
      }

    } catch (err) {
      setStatus('Okuma hatası: ' + err.message, 'connected');
    }

    document.getElementById('btn-read').disabled = false;
  }

  async function disconnectDevice() {
    if (device) {
      try {
        await device.releaseInterface(0);
        await device.close();
      } catch(e) {}
      device = null;
    }
    setStatus('Cihaz bağlı değil', '');
    document.getElementById('btn-connect').disabled = false;
    document.getElementById('btn-read').disabled = true;
    document.getElementById('btn-disconnect').disabled = true;
    document.getElementById('warn-box').style.display = 'block';
  }

  function showResult(uid, time) {
    document.getElementById('result-box').innerHTML = `
      <div class="uid-label">Kart UID</div>
      <div class="uid-value">${uid}</div>
      <div class="time-value">🕐 ${time}</div>
    `;
  }

  function addLog(uid, time) {
    logEntries.unshift({ uid, time });
    renderLog();
  }

  function renderLog() {
    const list = document.getElementById('log-list');
    if (logEntries.length === 0) {
      list.innerHTML = '<li style="justify-content:center; color:#334155; font-size:0.82rem;">Henüz kayıt yok</li>';
      return;
    }
    list.innerHTML = logEntries.map(e => `
      <li>
        <span class="log-uid">${e.uid}</span>
        <span class="log-time">${e.time}</span>
      </li>
    `).join('');
  }

  function clearLog() {
    logEntries = [];
    renderLog();
    document.getElementById('result-box').innerHTML = '<span class="empty-text">Henüz kart okutulmadı</span>';
  }
</script>
</body>
</html>
